[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "steamdeck-mcp"
dynamic = ["version"]
description = "MCP server that lets AI assistants manage a Steam Deck: battery, TDP, games, Proton, downloads, cleanup"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Menno" }]
keywords = ["mcp", "model-context-protocol", "steam-deck", "steamos", "proton", "ai"]
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/OWNER/steamdeck-mcp"
Issues = "https://github.com/OWNER/steamdeck-mcp/issues"

[project.scripts]
steamdeck-mcp = "steamdeck_mcp.server:main"

[tool.setuptools]
packages = ["steamdeck_mcp"]

[tool.setuptools.dynamic]
version = { attr = "steamdeck_mcp.__version__" }
